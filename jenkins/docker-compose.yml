services:
  jenkins:
    build: .
    container_name: jenkins
    user: root   # needed to use the host Docker socket; acceptable for a local lab only
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [ci-net]

volumes:
  jenkins_home:

networks:
  ci-net:
    name: ci-net