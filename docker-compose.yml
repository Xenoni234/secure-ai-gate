services:
  app:
    image: secure-ai-gate:${IMAGE_TAG:-latest}
    container_name: secure-ai-app
    environment:
      API_KEY: ${API_KEY:?API_KEY must be set}
      RATE_LIMIT: "60"
    ports:
      - "5050:5000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks: [ci-net]

networks:
  ci-net:
    external: true